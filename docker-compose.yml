services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: transjawa-aho
    restart: unless-stopped
    ports:
      - "9004:80"
    env_file:
      - .env
    environment:
      - PORT=80
    networks:
      - transjawa-network

networks:
  transjawa-network:
    external: true
